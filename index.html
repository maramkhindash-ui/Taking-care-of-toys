  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ماذا نفعل بألعابنا أثناء اللعب؟</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fef6e4 0%, #e8f4fd 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 14px 20px;
    height: 100vh;
  }
  .header { text-align: center; margin-bottom: 4px; flex-shrink: 0; }
  .title { font-size: 19px; font-weight: 800; color: #3a3a5c; margin: 4px 0; }
  .subtitle { font-size: 13px; color: #888; font-weight: 600; }

  .levels-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    width: 100%; max-width: 500px; gap: 16px; flex: 1; margin-top: 8px;
  }
  .levels-screen.hidden { display: none; }
  .level-card {
    display: flex; align-items: center; gap: 16px; width: 100%;
    background: #fff; border-radius: 18px; padding: 14px 18px;
    box-shadow: 0 5px 16px rgba(0,0,0,0.1); cursor: pointer;
    border: 3px solid transparent; transition: transform .15s ease;
  }
  .level-card:active { transform: scale(0.97); }
  .level-card .icon { font-size: 36px; }
  .level-card .info { flex: 1; text-align: right; }
  .level-card .info .lvl-title { font-size: 17px; font-weight: 800; color: #3a3a5c; }
  .level-card .info .lvl-sub { font-size: 13px; color: #888; margin-top: 3px; }
  .level-card .stars-mini { font-size: 15px; color: #ffca3a; min-width: 46px; text-align: left; }

  .sound-toggle {
    position: fixed; top: 12px; left: 12px;
    background: #fff; border: none; border-radius: 50%;
    width: 40px; height: 40px; font-size: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15); cursor: pointer; z-index: 10;
  }
  .sound-toggle:active { transform: scale(0.92); }

  .prompt-row {
    display: none; align-items: center; gap: 10px; margin: 4px 0 6px;
    width: 100%; max-width: 400px; flex-shrink: 0;
  }
  .prompt-row.show { display: flex; }
  .prompt-box {
    background: #fff; border-radius: 16px; padding: 10px 18px; flex: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08); font-size: 16px; font-weight: 700;
    color: #5b4b8a; text-align: center;
  }
  .speak-btn {
    background: #6c5ce7; border: none; border-radius: 50%;
    width: 38px; height: 38px; font-size: 16px; color: white; cursor: pointer;
    box-shadow: 0 3px 10px rgba(108,92,231,0.35); flex-shrink: 0;
  }
  .speak-btn:active { transform: scale(0.92); }
  .speak-btn.speaking { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(108,92,231,0.5);} to { box-shadow: 0 0 0 8px rgba(108,92,231,0);} }

  .back-row { width: 100%; max-width: 500px; display: none; flex-shrink: 0; }
  .back-row.show { display: flex; }
  .back-btn { background: none; border: none; color: #6c5ce7; font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 2px; }

  .progress { display: flex; gap: 8px; margin: 4px 0 6px; display: none; flex-shrink: 0; }
  .progress.show { display: flex; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #e0dcf2; transition: all .25s ease; }
  .dot.done { background: #4caf50; transform: scale(1.15); }
  .dot.current { background: #6c5ce7; transform: scale(1.3); box-shadow: 0 0 0 3px #d9d3f8; }

  .game-area {
    display: none; flex-direction: column; align-items: center; width: 100%;
    flex: 1; min-height: 0; justify-content: flex-start;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 400px;
  }
  .card {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    cursor: pointer;
    border: 5px solid transparent;
    transition: transform .15s ease, border-color .2s ease;
    flex-shrink: 0;
  }
  .card:active { transform: scale(0.98); }
  .card img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    object-position: top center;
    background: #f0eef8;
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }
  .badge {
    position: absolute; top: 8px; left: 8px; font-size: 30px;
    opacity: 0; transform: scale(0.4); transition: all .3s ease;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
  }
  .badge.show { opacity: 1; transform: scale(1); }
  .card.correct { border-color: #4caf50; }
  .card.wrong-flash { border-color: #ff7675; }
  .card.locked { cursor: default; }
  .card.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .feedback { min-height: 26px; margin-top: 10px; font-size: 15px; font-weight: 700; text-align: center; color: #3a3a5c; flex-shrink: 0; }

  .summary {
    display: none; flex-direction: column; align-items: center; text-align: center;
    background: #fff; border-radius: 22px; padding: 26px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); max-width: 420px; width: 100%;
  }
  .summary.show { display: flex; }
  .summary h2 { font-size: 22px; color: #3a3a5c; margin: 6px 0; }
  .summary .score { font-size: 34px; font-weight: 900; color: #6c5ce7; margin: 8px 0; }
  .summary .stars { font-size: 30px; margin: 6px 0 12px; letter-spacing: 4px; }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .restart-btn, .levels-btn {
    padding: 11px 24px; font-size: 14px; font-weight: 700; border: none; border-radius: 28px;
    color: white; cursor: pointer; box-shadow: 0 5px 14px rgba(0,0,0,0.2);
  }
  .restart-btn { background: #4caf50; }
  .levels-btn { background: #6c5ce7; }
  .restart-btn:active, .levels-btn:active { transform: scale(0.96); }
  #summaryMsg { font-size: 14px; color: #666; margin-bottom: 8px; }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle">🔊</button>

<div class="header">
  <div class="title">🌟 ماذا نفعل بألعابنا أثناء اللعب؟ 🌟</div>
  <div class="subtitle">المحافظة على الألعاب أثناء اللعب</div>
</div>

<div class="levels-screen" id="levelsScreen">
  <div class="level-card lvl1" data-level="1">
    <div class="icon">🧸</div>
    <div class="info">
      <div class="lvl-title">المستوى الأول</div>
      <div class="lvl-sub">اختر بين صورتين</div>
    </div>
    <div class="stars-mini" id="starsL1"></div>
  </div>
  <div class="level-card lvl2" data-level="2">
    <div class="icon">🎯</div>
    <div class="info">
      <div class="lvl-title">المستوى الثاني</div>
      <div class="lvl-sub">اختر بين ثلاث صور</div>
    </div>
    <div class="stars-mini" id="starsL2"></div>
  </div>
</div>

<div class="back-row" id="backRow">
  <button class="back-btn" id="backBtn">➡️ العودة للمستويات</button>
</div>

<div class="prompt-row" id="promptRow">
  <button class="speak-btn" id="speakBtn">🔈</button>
  <div class="prompt-box" id="promptBox">ماذا نفعل بألعابنا أثناء اللعب؟</div>
</div>

<div class="progress" id="progress"></div>

<div class="game-area" id="gameArea">
  <div class="cards" id="cards"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="summary" id="summary">
  <h2>أحسنت! 🎉</h2>
  <div class="score" id="scoreText"></div>
  <div class="stars" id="starsText"></div>
  <div id="summaryMsg"></div>
  <div class="btn-row">
    <button class="restart-btn" id="restartBtn">🔁 إعادة المستوى</button>
    <button class="levels-btn" id="levelsBtn">📋 المستويات</button>
  </div>
</div>

/* ============== Config ============== */
const TRIALS_PER_LEVEL = 5;
const WRONG_MARK_DURATION = 2000;   // مدة بقاء علامة ❌ قبل إزالتها
const PAUSE_AFTER_CORRECT = 900;    // مهلة إضافية بعد انتهاء صوت الإجابة قبل الانتقال للتكرار التالي
const QUESTION_DELAY = 350;         // مهلة بسيطة قبل تشغيل صوت السؤال عند بداية كل تكرار

const LEVELS = {
  1: { images: [ {src: IMG1, correct: true}, {src: IMG2, correct: false} ] },
  2: { images: [ {src: IMG1, correct: true}, {src: IMG3, correct: false}, {src: IMG4, correct: false} ] }
};

/* ============== State ============== */
let soundOn = true;
let currentLevel = null;
let trialIndex = 0;
let correctCount = 0;
let locked = false;
let currentAudio = null;
const starsEarned = { 1: 0, 2: 0 };

/* ============== Elements ============== */
const levelsScreen = document.getElementById('levelsScreen');
const backRow = document.getElementById('backRow');
const backBtn = document.getElementById('backBtn');
const promptRow = document.getElementById('promptRow');
const speakBtn = document.getElementById('speakBtn');
const progressEl = document.getElementById('progress');
const gameArea = document.getElementById('gameArea');
const cardsEl = document.getElementById('cards');
const feedbackEl = document.getElementById('feedback');
const summaryEl = document.getElementById('summary');
const scoreText = document.getElementById('scoreText');
const starsText = document.getElementById('starsText');
const summaryMsg = document.getElementById('summaryMsg');
const restartBtn = document.getElementById('restartBtn');
const levelsBtn = document.getElementById('levelsBtn');
const soundToggle = document.getElementById('soundToggle');
const starsL1 = document.getElementById('starsL1');
const starsL2 = document.getElementById('starsL2');

/* ============== عناصر صوت ثابتة (تُنشأ مرة واحدة فقط) ============== */
/* إنشاء نفس عنصر الصوت وإعادة استخدامه ضروري حتى يعمل التشغيل التلقائي
   على المتصفحات الصارمة (خصوصًا Safari/iOS) بدون الحاجة لضغطة زر جديدة
   في كل مرة — يكفي "فتح القفل" مرة واحدة عند أول تفاعل من المستخدم. */
const audioQuestionEl = new Audio(AUDIO_QUESTION);
const audioCorrectEl  = new Audio(AUDIO_CORRECT);
const audioWrongEl    = new Audio(AUDIO_WRONG);
[audioQuestionEl, audioCorrectEl, audioWrongEl].forEach(a => {
  a.preload = 'auto';
  a.volume = 1.0;
});

let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  [audioQuestionEl, audioCorrectEl, audioWrongEl].forEach(a => {
    try {
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      a.pause();
      a.currentTime = 0;
    } catch (e) {}
  });
}

/* ============== Audio helpers (تجنّب تداخل الأصوات) ============== */
function stopCurrentAudio() {
  if (currentAudio) {
    currentAudio.onended = null;
    currentAudio.onerror = null;
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
}

function playAudio(audioEl, onEnded) {
  stopCurrentAudio();
  if (!soundOn) {
    if (onEnded) setTimeout(onEnded, 300);
    return null;
  }
  currentAudio = audioEl;
  audioEl.currentTime = 0;
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    audioEl.onended = null;
    audioEl.onerror = null;
    if (onEnded) onEnded();
  };
  audioEl.onended = finish;
  audioEl.onerror = finish;
  const p = audioEl.play();
  if (p && p.catch) p.catch(finish);
  return audioEl;
}

/* ============== تبديل الصوت ============== */
soundToggle.addEventListener('click', () => {
  soundOn = !soundOn;
  soundToggle.textContent = soundOn ? '🔊' : '🔇';
  if (!soundOn) stopCurrentAudio();
});

/* ============== شاشة المستويات ============== */
document.querySelectorAll('.level-card').forEach(card => {
  card.addEventListener('click', () => {
    unlockAudio();
    const level = parseInt(card.dataset.level, 10);
    openLevel(level);
  });
});

function refreshLevelStars() {
  starsL1.textContent = starsEarned[1] > 0 ? '⭐'.repeat(starsEarned[1]) : '';
  starsL2.textContent = starsEarned[2] > 0 ? '⭐'.repeat(starsEarned[2]) : '';
}

function openLevel(level) {
  currentLevel = level;
  trialIndex = 0;
  correctCount = 0;
  lastOrderSignature = null;
  levelsScreen.classList.add('hidden');
  backRow.classList.add('show');
  promptRow.classList.add('show');
  progressEl.classList.add('show');
  gameArea.style.display = 'flex';
  summaryEl.classList.remove('show');
  buildProgressDots();
  startTrial();
}

backBtn.addEventListener('click', goToLevels);
levelsBtn.addEventListener('click', goToLevels);

function goToLevels() {
  stopCurrentAudio();
  currentLevel = null;
  levelsScreen.classList.remove('hidden');
  backRow.classList.remove('show');
  promptRow.classList.remove('show');
  progressEl.classList.remove('show');
  gameArea.style.display = 'none';
  summaryEl.classList.remove('show');
  refreshLevelStars();
}

/* ============== نقاط التقدّم ============== */
function buildProgressDots() {
  progressEl.innerHTML = '';
  for (let i = 0; i < TRIALS_PER_LEVEL; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    progressEl.appendChild(dot);
  }
  updateProgressDots();
}

function updateProgressDots() {
  const dots = progressEl.querySelectorAll('.dot');
  dots.forEach((dot, i) => {
    dot.classList.remove('done', 'current');
    if (i < trialIndex) dot.classList.add('done');
    else if (i === trialIndex) dot.classList.add('current');
  });
}

/* ============== خلط المصفوفة ============== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============== بدء تكرار جديد ============== */
let lastOrderSignature = null;

function getOrderSignature(arr) {
  return arr.map(it => (it.correct ? 'C' : 'W') + it.src.slice(-12)).join('|');
}

function shuffleDifferentFromLast(baseArr) {
  let attempt = shuffle(baseArr);
  let signature = getOrderSignature(attempt);
  let tries = 0;
  // أعِد الخلط حتى يختلف الترتيب عن التكرار السابق (حتى مع صورتين فقط)
  while (signature === lastOrderSignature && tries < 8) {
    attempt = shuffle(baseArr);
    signature = getOrderSignature(attempt);
    tries++;
  }
  if (signature === lastOrderSignature && baseArr.length > 1) {
    // كحل أخير: بدّل أول عنصرين يدويًا لضمان اختلاف الترتيب
    attempt = attempt.slice();
    [attempt[0], attempt[1]] = [attempt[1], attempt[0]];
    signature = getOrderSignature(attempt);
  }
  lastOrderSignature = signature;
  return attempt;
}

function startTrial() {
  locked = false;
  feedbackEl.textContent = '';
  updateProgressDots();

  const images = shuffleDifferentFromLast(LEVELS[currentLevel].images);
  cardsEl.innerHTML = '';
  images.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.correct = item.correct ? '1' : '0';

    const img = document.createElement('img');
    img.src = item.src;
    img.alt = 'صورة اختيار';
    img.draggable = false;

    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = '';

    card.appendChild(img);
    card.appendChild(badge);
    card.addEventListener('click', () => onCardTap(card, badge));
    cardsEl.appendChild(card);
  });

  // تشغيل صوت السؤال بعد مهلة قصيرة، بصوت مرتفع وواضح
  setTimeout(() => {
    playAudio(audioQuestionEl);
  }, QUESTION_DELAY);
}

/* ============== الضغط على السؤال لإعادة سماعه ============== */
speakBtn.addEventListener('click', () => {
  speakBtn.classList.add('speaking');
  playAudio(audioQuestionEl, () => speakBtn.classList.remove('speaking'));
});

/* ============== التعامل مع الاختيار ============== */
function onCardTap(card, badge) {
  if (locked) return;
  const isCorrect = card.dataset.correct === '1';

  if (isCorrect) {
    locked = true;
    document.querySelectorAll('.card').forEach(c => c.classList.add('locked'));
    card.classList.add('correct');
    badge.textContent = '✅';
    badge.classList.add('show');
    feedbackEl.textContent = 'ممتاز! 👏';

    playAudio(audioCorrectEl, () => {
      setTimeout(nextStep, PAUSE_AFTER_CORRECT);
    });
  } else {
    card.classList.add('wrong-flash', 'shake');
    badge.textContent = '❌';
    badge.classList.add('show');
    feedbackEl.textContent = 'حاول مرة أخرى';

    playAudio(audioWrongEl, () => {
      setTimeout(() => {
        card.classList.remove('wrong-flash', 'shake');
        badge.classList.remove('show');
        badge.textContent = '';
        feedbackEl.textContent = '';
      }, WRONG_MARK_DURATION);
    });
  }
}

/* ============== الانتقال للتكرار التالي أو إنهاء المستوى ============== */
function nextStep() {
  correctCount++;
  trialIndex++;
  if (trialIndex >= TRIALS_PER_LEVEL) {
    finishLevel();
  } else {
    startTrial();
  }
}

function finishLevel() {
  updateProgressDots();
  gameArea.style.display = 'none';
  promptRow.classList.remove('show');
  progressEl.classList.remove('show');
  summaryEl.classList.add('show');

  const stars = 3; // إتمام كل التكرارات الخمسة بنجاح
  starsEarned[currentLevel] = Math.max(starsEarned[currentLevel], stars);

  scoreText.textContent = `${correctCount} / ${TRIALS_PER_LEVEL}`;
  starsText.textContent = '⭐'.repeat(stars);
  summaryMsg.textContent = 'أحسنت! لقد حافظت على ألعابك بشكل رائع 🎉';
}

restartBtn.addEventListener('click', () => {
  unlockAudio();
  summaryEl.classList.remove('show');
  backRow.classList.add('show');
  promptRow.classList.add('show');
  progressEl.classList.add('show');
  gameArea.style.display = 'flex';
  trialIndex = 0;
  correctCount = 0;
  lastOrderSignature = null;
  buildProgressDots();
  startTrial();
});

/* ============== حالة البدء ============== */
refreshLevelStars();
</script>
